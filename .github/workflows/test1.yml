name: CI Test Suite & Build Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Unit & E2E Testing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    # YEH LINE ZAROORI HAI - Is se GitHub Tabl 2 folder ke andar jayega!
    defaults:
      run:
        working-directory: './Tabl 2'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './Tabl 2/package-lock.json'

      - name: Install Dependencies & Fix Testing Environment
        run: |
          npm ci
          npm uninstall jsdom
          npm install -D happy-dom

      - name: Run ESLint
        run: npm run lint --if-present

      - name: Run Vitest Suite (Unit & Component Tests)
        run: npm run test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: npm run test:e2e --if-present
        env:
          CI: true
